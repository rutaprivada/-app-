<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Ultra-dark Titanium Obsidian -->
    <linearGradient id="titaniumBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c2b" />
      <stop offset="50%" stop-color="#0a0e17" />
      <stop offset="100%" stop-color="#04060a" />
    </linearGradient>

    <!-- Luxury 24K Gold Gradient -->
    <linearGradient id="gold24k" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="25%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="75%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Subtle Radial Amber Glow behind car -->
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadows & Glow Filters -->
    <filter id="goldGlowFilter" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container with Gold Border -->
  <rect width="512" height="512" rx="100" fill="url(#titaniumBg)" />
  <rect width="492" height="492" x="10" y="10" rx="92" fill="none" stroke="url(#gold24k)" stroke-width="5" stroke-opacity="0.95" />
  
  <!-- Subtle Internal Glow Circle -->
  <circle cx="256" cy="210" r="160" fill="url(#centerGlow)" />

  <!-- 3 Executive Stars Emblem over the Car -->
  <g id="threeStarsEmblem">
    <!-- Center Star (Prominent) -->
    <g transform="translate(256, 78) scale(3.6)" filter="url(#goldGlowFilter)">
      <path d="M 0 -7 L 2.1 -2.1 L 7.2 -2.1 L 3.1 1.2 L 4.8 6.3 L 0 3.2 L -4.8 6.3 L -3.1 1.2 L -7.2 -2.1 L -2.1 -2.1 Z" fill="url(#gold24k)" />
    </g>
    <!-- Left Star -->
    <g transform="translate(182, 94) scale(2.6)">
      <path d="M 0 -7 L 2.1 -2.1 L 7.2 -2.1 L 3.1 1.2 L 4.8 6.3 L 0 3.2 L -4.8 6.3 L -3.1 1.2 L -7.2 -2.1 L -2.1 -2.1 Z" fill="url(#gold24k)" opacity="0.95" />
    </g>
    <!-- Right Star -->
    <g transform="translate(330, 94) scale(2.6)">
      <path d="M 0 -7 L 2.1 -2.1 L 7.2 -2.1 L 3.1 1.2 L 4.8 6.3 L 0 3.2 L -4.8 6.3 L -3.1 1.2 L -7.2 -2.1 L -2.1 -2.1 Z" fill="url(#gold24k)" opacity="0.95" />
    </g>
  </g>

  <!-- Executive Sedan Silhouette -->
  <g transform="translate(256, 180) scale(3.3)" filter="url(#goldGlowFilter)">
    <!-- Car Body -->
    <path d="M -30 12 
             C -30 7, -26 3, -19 3 
             L -11 -6 
             C -9 -9, -6 -11, 0 -11 
             L 11 -11 
             C 17 -11, 21 -8, 25 3 
             L 28 5 
             C 31 7, 32 10, 32 14 
             L -30 14 Z" 
          fill="url(#gold24k)" />

    <!-- Windshield & Windows -->
    <path d="M -10 -4 L -16 2 L -2 2 L -2 -8 C -6 -8, -8 -7, -10 -4 Z" fill="#090d14" opacity="0.96" />
    <path d="M 2 -8 L 2 2 L 14 2 L 10 -5 C 8 -7, 5 -8, 2 -8 Z" fill="#090d14" opacity="0.96" />

    <!-- Headlight & Taillight accents -->
    <circle cx="28" cy="8" r="2.2" fill="#ffffff" />
    <circle cx="-28" cy="8" r="2" fill="#ef4444" />

    <!-- Wheels -->
    <circle cx="-17" cy="14" r="5.5" fill="#090d14" stroke="url(#gold24k)" stroke-width="2.2" />
    <circle cx="-17" cy="14" r="2" fill="url(#gold24k)" />
    <circle cx="17" cy="14" r="5.5" fill="#090d14" stroke="url(#gold24k)" stroke-width="2.2" />
    <circle cx="17" cy="14" r="2" fill="url(#gold24k)" />
  </g>

  <!-- Road / Highway Arc -->
  <path d="M 95 330 C 165 270, 215 242, 256 242 C 297 242, 347 270, 417 330" 
        fill="none" stroke="url(#gold24k)" stroke-width="11" stroke-linecap="round" />
  
  <!-- Dashed Highway Lane Centerline -->
  <path d="M 155 310 C 205 278, 297 278, 347 310" 
        fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="4.5" stroke-dasharray="9,11" stroke-linecap="round" />

  <!-- Brand Typography: RUTA PRIVADA -->
  <text x="256" y="396" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="38" font-weight="900" letter-spacing="4" fill="#ffffff">
    RUTA<tspan fill="url(#gold24k)">PRIVADA</tspan>
  </text>
  
  <!-- Subtitle: TRASLADOS EJECUTIVOS -->
  <text x="256" y="432" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="6.5" fill="#cbd5e1">
    TRASLADOS EJECUTIVOS
  </text>
</svg>
