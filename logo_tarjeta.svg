<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c2b" />
      <stop offset="60%" stop-color="#0c111a" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>

    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="25%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="75%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <radialGradient id="cardGlow" cx="25%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="800" height="450" rx="28" fill="url(#cardBg)" />
  <rect width="784" height="434" x="8" y="8" rx="22" fill="none" stroke="url(#goldLinear)" stroke-width="2.5" stroke-opacity="0.8" />
  <circle cx="200" cy="225" r="160" fill="url(#cardGlow)" />

  <!-- Left Icon Group -->
  <g transform="translate(180, 205)">
    <!-- Road Arc -->
    <path d="M -70 50 C -30 20, 0 10, 20 10 C 40 10, 70 20, 110 50" 
          fill="none" stroke="url(#goldLinear)" stroke-width="6" stroke-linecap="round" />
    <path d="M -40 38 C -10 23, 30 23, 60 38" 
          fill="none" stroke="#ffffff" stroke-opacity="0.8" stroke-width="2.5" stroke-dasharray="6,7" stroke-linecap="round" />

    <!-- Sedan -->
    <g transform="translate(20, -15) scale(1.8)" filter="url(#goldGlow)">
      <path d="M -30 12 C -30 7, -26 3, -19 3 L -11 -6 C -9 -9, -6 -11, 0 -11 L 11 -11 C 17 -11, 21 -8, 25 3 L 28 5 C 31 7, 32 10, 32 14 L -30 14 Z" fill="url(#goldLinear)" />
      <path d="M -10 -4 L -16 2 L -2 2 L -2 -8 C -6 -8, -8 -7, -10 -4 Z" fill="#0c111a" opacity="0.95" />
      <path d="M 2 -8 L 2 2 L 14 2 L 10 -5 C 8 -7, 5 -8, 2 -8 Z" fill="#0c111a" opacity="0.95" />
      <circle cx="28" cy="8" r="1.8" fill="#ffffff" />
      <circle cx="-28" cy="8" r="1.5" fill="#ef4444" />
      <circle cx="-17" cy="14" r="5" fill="#0c111a" stroke="url(#goldLinear)" stroke-width="1.8" />
      <circle cx="-17" cy="14" r="1.8" fill="url(#goldLinear)" />
      <circle cx="17" cy="14" r="5" fill="#0c111a" stroke="url(#goldLinear)" stroke-width="1.8" />
      <circle cx="17" cy="14" r="1.8" fill="url(#goldLinear)" />
    </g>

    <!-- 3 Stars -->
    <g transform="translate(20, -75) scale(2)" filter="url(#goldGlow)">
      <path d="M 0 -7 L 2.1 -2.1 L 7.2 -2.1 L 3.1 1.2 L 4.8 6.3 L 0 3.2 L -4.8 6.3 L -3.1 1.2 L -7.2 -2.1 L -2.1 -2.1 Z" fill="url(#goldLinear)" />
    </g>
    <g transform="translate(-20, -66) scale(1.5)">
      <path d="M 0 -7 L 2.1 -2.1 L 7.2 -2.1 L 3.1 1.2 L 4.8 6.3 L 0 3.2 L -4.8 6.3 L -3.1 1.2 L -7.2 -2.1 L -2.1 -2.1 Z" fill="url(#goldLinear)" opacity="0.9" />
    </g>
    <g transform="translate(60, -66) scale(1.5)">
      <path d="M 0 -7 L 2.1 -2.1 L 7.2 -2.1 L 3.1 1.2 L 4.8 6.3 L 0 3.2 L -4.8 6.3 L -3.1 1.2 L -7.2 -2.1 L -2.1 -2.1 Z" fill="url(#goldLinear)" opacity="0.9" />
    </g>
  </g>

  <!-- Right Typography and Info for Card -->
  <g transform="translate(390, 160)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="2">
      RUTA<tspan fill="url(#goldLinear)">PRIVADA</tspan>
    </text>
    <text x="2" y="32" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="16" font-weight="600" fill="#94a3b8" letter-spacing="4">
      TRASLADOS EJECUTIVOS
    </text>
    
    <line x1="2" y1="52" x2="350" y2="52" stroke="url(#goldLinear)" stroke-width="2" stroke-opacity="0.6" />

    <text x="2" y="85" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="18" font-weight="700" fill="#34d399">
      📞 WhatsApp: +54 9 11 7373-8790
    </text>
    <text x="2" y="115" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="15" font-weight="500" fill="#cbd5e1">
      ✈️ Aeropuertos Ezeiza &amp; Aeroparque • CABA • GBA
    </text>
    <text x="2" y="142" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="400" fill="#94a3b8">
      ⭐ Chofer Profesional • Puntualidad • Vehículo Confort
    </text>
  </g>
</svg>
